[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#E8EEF4"
textColor = "#172B45"
font = "sans serif"

[server]
# Community Cloud adres/portu kendisi belirler. Yerel baslat.py 127.0.0.1 kullanır.
headless = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
# Ham kuruş verisini TL etiketiyle kopyalamayı/indirmeyi önler.
# Uygulamadaki güvenli CSV ve Excel indirme düğmeleri kullanılmaya devam eder.
disableDataExport = true
